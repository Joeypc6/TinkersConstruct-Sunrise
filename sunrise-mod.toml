id = "tconstruct"
name = "Tinkers' Construct"
version = "3.12.2"
description = "Smelteries, casting, modular tools built from material parts, slime islands and gadgets. A port of Tinkers' Construct 1.20.1-3.12.1.231 (SlimeKnights, MIT) and the parts of Mantle it uses to Sunrise's mod API."
authors = ["Sunrise port: Joeypc6", "SlimeKnights", "mDiyo", "boni", "KnightMiner"]
api = "0.2"
side = "both"
capabilities = ["registries"]
# Mantle's assets and tags ship under its own namespace; "trimmed" is the armor trim permutations file.
namespaces = ["mantle", "trimmed"]
license = "MIT"
license_url = "https://github.com/Joeypc6/TinkersConstruct-Sunrise/blob/main/LICENSE"
credits = "Sunrise port by Joeypc6, based on Tinkers' Construct and Mantle by SlimeKnights (mDiyo, boni, KnightMiner and contributors)."
homepage = "https://github.com/Joeypc6/TinkersConstruct-Sunrise"
issues = "https://github.com/Joeypc6/TinkersConstruct-Sunrise/issues"

[native]
game = "26.3"
# Pinned to Sunrise Dev 2026-11-24 (f8aa80e).
sunrise = "f8aa80e4c40cf1a5d30e85d13937f3fcf06d8237"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"

[dependencies]
# The shared W guide (assets/tconstruct/ae2guide), recipe viewer (Tinkers' categories from Rust) and Jade.
guideme = { version = "^0.1", optional = true }
jei = { version = "^0.5", optional = true }
jade = { version = "^26", optional = true }
